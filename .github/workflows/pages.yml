name: Deploy Early Medieval Ireland Explorer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate public city data and runtime
        shell: bash
        run: |
          python -m json.tool data/cities.json > /dev/null
          python -m json.tool data/dublin.json > /dev/null
          python -m json.tool data/waterford.json > /dev/null
          python -m json.tool data/waterford-ad1050-preproduction.json > /dev/null
          node --check assets/city-runtime.js
          node --check assets/home.js
          node --check assets/dublin.js
          node --check assets/reconstruction.js
          grep -q '"status": "research_pack"' data/waterford.json
          grep -q '"birdseye_status": "NOT_YET_APPROVED"' data/waterford.json
          grep -q '"status": "READY_FOR_FIRST_GEOMETRY_D_CANDIDATE"' data/waterford-ad1050-preproduction.json
          grep -q 'RESOLVED_AS_RELATIONSHIP_NOT_LINE' data/waterford-ad1050-preproduction.json
          grep -q 'Bakehouse Lane AD1070-1080 ditch alignment as the exact AD1050 defensive boundary' data/waterford-ad1050-preproduction.json
          grep -q 'Bailey.*New Street ditches as a proven exact AD950 circuit' data/waterford.json
          grep -q 'Bakehouse Lane AD1070–1080 ditch as default AD1050 boundary' data/waterford.json
          grep -q 'Peter/Olaf AD1083 feature as securely present in AD1050' data/waterford.json
          grep -q 'WAT_EARLY_QUAY_UNKNOWN' data/waterford.json
          grep -q 'MUST SHOW' waterford.html
          grep -q 'BIRD’S-EYE GENERATION GATE' waterford.html
          test -s research/waterford-reconstruction-pack-v024.md
          test -s research/waterford-ad1050-master-constraints-v025.md
          test -s research/waterford-ad1050-image-prompt-v025.txt

      - name: Prepare public reconstruction asset
        shell: bash
        run: |
          cat \
            assets/images/dyflin_ad950_birds_eye_final.b64.part1.txt \
            assets/images/dyflin_ad950_birds_eye_final.b64.part2.txt \
            assets/images/dyflin_ad950_birds_eye_final.b64.part3.txt \
            assets/images/dyflin_ad950_birds_eye_final.b64.part4.txt \
            assets/images/dyflin_ad950_birds_eye_final.b64.part5.txt \
            assets/images/dyflin_ad950_birds_eye_final.b64.part6.txt \
            | base64 --decode > assets/images/dyflin_ad950_birds_eye_final.webp
          test -s assets/images/dyflin_ad950_birds_eye_final.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/images/dyflin_ad950_birds_eye_final.webp')
          b = p.read_bytes()
          assert len(b) > 10000, f'WebP asset unexpectedly small: {len(b)} bytes'
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', 'Decoded showcase asset is not a valid WebP container'
          print(f'validated WebP asset: {len(b)} bytes')
          PY
          rm assets/images/dyflin_ad950_birds_eye_final.b64.part*.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
