name: Deploy Early Medieval Ireland Explorer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare public reconstruction asset
        shell: bash
        run: |
          cat \
            assets/images/dyflin_ad950_birds_eye_final.b64.part1.txt \
            assets/images/dyflin_ad950_birds_eye_final.b64.part2.txt \
            assets/images/dyflin_ad950_birds_eye_final.b64.part3.txt \
            | base64 --decode > assets/images/dyflin_ad950_birds_eye_final.webp
          test -s assets/images/dyflin_ad950_birds_eye_final.webp
          rm assets/images/dyflin_ad950_birds_eye_final.b64.part*.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
